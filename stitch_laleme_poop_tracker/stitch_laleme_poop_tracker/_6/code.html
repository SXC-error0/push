<script>
        // Micro-interaction for filter chips
        const chips = document.querySelectorAll('nav button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary', 'hard-shadow-sm');
                    c.classList.add('bg-surface-container', 'border-outline-variant', 'text-on-surface-variant');
                });
                chip.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary', 'hard-shadow-sm');
                chip.classList.remove('bg-surface-container', 'border-outline-variant', 'text-on-surface-variant');
            });
        });

        // Simple parallax-like tilt effect for stickers on scroll
        window.addEventListener('scroll', () => {
            const stickers = document.querySelectorAll('.sticker-border');
            stickers.forEach((s, i) => {
                const speed = 0.05;
                const yPos = -(window.scrollY * speed);
                if (i % 2 === 0) {
                    s.style.transform = `translateY(${yPos}px) rotate(1deg)`;
                } else {
                    s.style.transform = `translateY(${yPos}px) rotate(-1deg)`;
                }
            });
        });
    </script>
